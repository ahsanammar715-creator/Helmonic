name: Deploy validated Helmonic Consult image

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: RG-HELMONIC-DEV
  CONTAINER_APP: ca-helmonic-consult-dev-002
  TENANT_ID: 360eacb5-68c3-400c-a366-0382ec3a7b4a
  IMAGE: acrhelmonicdev001-etd4eqevdcf6e7bs.azurecr.io/helmonic-consult:a7e49059bd3f709debd91741fb2fcdffc67ad542
  VALIDATION_SUFFIX: val${{ github.run_id }}a${{ github.run_attempt }}
  FINAL_SUFFIX: fx${{ github.run_id }}a${{ github.run_attempt }}
  VALIDATION_LABEL: smoke${{ github.run_id }}a${{ github.run_attempt }}
  AUTH_API_VERSION: 2025-07-01

jobs:
  deploy-validate-promote:
    name: Zero-traffic validation and promotion
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated release scripts
        uses: actions/checkout@v4

      - name: Sign in to Azure with release-branch OIDC
        uses: azure/login@v2
        with:
          client-id: d265e55d-f8b6-421a-9a82-064183cab7e6
          tenant-id: 360eacb5-68c3-400c-a366-0382ec3a7b4a
          subscription-id: 14f94f77-4e71-4b80-b6c9-e09b192fcf42

      - name: Install Container Apps CLI support
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Create zero-traffic candidate, test five answer types, and promote
        shell: bash
        run: |
          set -euo pipefail

          mode="$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.activeRevisionsMode -o tsv)"
          test "$mode" = "Multiple"

          live_revision="$(az containerapp ingress traffic show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query "[?weight==\`100\`].revisionName | [0]" -o tsv)"
          test -n "$live_revision"
          echo "Current live revision: $live_revision"

          candidate=""
          validation_label=""
          auth_config_url=""
          auth_restore_file=""
          auth_policy_changed=""
          restore_auth_policy() {
            if test "$auth_policy_changed" != "yes"; then return 0; fi

            az rest --method put --url "$auth_config_url" --body "@$auth_restore_file" --only-show-errors >/dev/null
            for restore_attempt in $(seq 1 12); do
              restored_file="$RUNNER_TEMP/consult-auth-restored-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
              az rest --method get --url "$auth_config_url" --only-show-errors > "$restored_file"
              if node - "$auth_restore_file" "$restored_file" <<'NODE'
          const fs = require('fs');
          const expected = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).properties
            ?.identityProviders?.azureActiveDirectory?.validation ?? null;
          const actual = JSON.parse(fs.readFileSync(process.argv[3], 'utf8')).properties
            ?.identityProviders?.azureActiveDirectory?.validation ?? null;
          process.exit(JSON.stringify(expected) === JSON.stringify(actual) ? 0 : 1);
          NODE
              then
                auth_policy_changed=""
                echo "Original Entra authorization policy restored and verified."
                return 0
              fi
              sleep 5
            done
            echo "The original Entra authorization policy could not be verified after restoration." >&2
            return 1
          }
          cleanup_candidate() {
            set +e
            restore_auth_policy
            if test -n "$validation_label"; then
              az containerapp revision label remove -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --label "$validation_label" --yes --only-show-errors >/dev/null 2>&1 || true
            fi
            if test -n "$candidate"; then
              az containerapp revision deactivate -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --revision "$candidate" --only-show-errors >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_candidate EXIT

          candidate="$(az containerapp revision copy -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --from-revision "$live_revision" --image "$IMAGE" --revision-suffix "$VALIDATION_SUFFIX" --min-replicas 1 --max-replicas 1 --query properties.latestRevisionName -o tsv --only-show-errors)"
          test -n "$candidate"
          echo "Validation revision: $candidate"

          candidate_weight="$(az containerapp ingress traffic show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query "[?revisionName=='$candidate'].weight | [0]" -o tsv)"
          test -z "$candidate_weight" -o "$candidate_weight" = "0"

          healthy=""
          for attempt in $(seq 1 36); do
            state="$(az containerapp revision show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --revision "$candidate" --query properties.provisioningState -o tsv)"
            healthy="$(az containerapp revision show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --revision "$candidate" --query properties.healthState -o tsv)"
            if test "$state" = "Provisioned" && test "$healthy" = "Healthy"; then break; fi
            sleep 10
          done
          test "$healthy" = "Healthy"

          validation_label="$VALIDATION_LABEL"
          az containerapp revision label add -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --revision "$candidate" --label "$validation_label" --yes --only-show-errors >/dev/null

          app_fqdn="$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          test -n "$app_fqdn"
          base_domain="${app_fqdn#*.}"
          candidate_url="https://${CONTAINER_APP}---${validation_label}.${base_domain}"

          auth_client_id="$(az containerapp auth microsoft show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query registration.clientId -o tsv --only-show-errors)"
          if test -z "$auth_client_id"; then
            auth_client_id="$(az containerapp auth show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.identityProviders.azureActiveDirectory.registration.clientId -o tsv --only-show-errors)"
          fi
          test -n "$auth_client_id"

          allowed_audience="$(az containerapp auth microsoft show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query 'validation.allowedAudiences[0]' -o tsv --only-show-errors || true)"
          auth_secret_name="$(az containerapp auth microsoft show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query registration.clientSecretSettingName -o tsv --only-show-errors)"
          test -n "$auth_secret_name"
          auth_secret="$(az containerapp secret list -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --show-values --query "[?name=='$auth_secret_name'].value | [0]" -o tsv --only-show-errors)"
          test -n "$auth_secret"
          echo "::add-mask::$auth_secret"

          access_token=""
          for resource in "$allowed_audience" "api://$auth_client_id" "$auth_client_id"; do
            test -n "$resource" || continue
            scope="${resource%/}/.default"
            token_json="$(curl --silent --show-error --fail \
              --request POST "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token" \
              --header 'content-type: application/x-www-form-urlencoded' \
              --data-urlencode "client_id=$auth_client_id" \
              --data-urlencode "client_secret=$auth_secret" \
              --data-urlencode 'grant_type=client_credentials' \
              --data-urlencode "scope=$scope" || true)"
            access_token="$(printf '%s' "$token_json" | node -e 'let body=""; process.stdin.on("data", chunk => body += chunk).on("end", () => { try { process.stdout.write(JSON.parse(body).access_token || ""); } catch {} });')"
            test -n "$access_token" || continue
            echo "::add-mask::$access_token"
            break
          done
          test -n "$access_token"
          echo "Short-lived release-test token minted."

          release_principal_object_id="$(ACCESS_TOKEN="$access_token" node <<'NODE'
          const token = process.env.ACCESS_TOKEN || '';
          const payloadPart = token.split('.')[1] || '';
          try {
            const payload = JSON.parse(Buffer.from(payloadPart, 'base64url').toString('utf8'));
            const objectId = payload.oid || payload.sub || '';
            if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(objectId)) {
              process.stdout.write(objectId);
            }
          } catch {}
          NODE
          )"
          test -n "$release_principal_object_id"
          release_application_id="$(ACCESS_TOKEN="$access_token" node <<'NODE'
          const token = process.env.ACCESS_TOKEN || '';
          const payloadPart = token.split('.')[1] || '';
          try {
            const payload = JSON.parse(Buffer.from(payloadPart, 'base64url').toString('utf8'));
            const applicationId = payload.azp || payload.appid || '';
            if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(applicationId)) {
              process.stdout.write(applicationId);
            }
          } catch {}
          NODE
          )"
          test -n "$release_application_id"
          release_audience="$(ACCESS_TOKEN="$access_token" AUTH_CLIENT_ID="$auth_client_id" node <<'NODE'
          const token = process.env.ACCESS_TOKEN || '';
          const clientId = process.env.AUTH_CLIENT_ID || '';
          const payloadPart = token.split('.')[1] || '';
          try {
            const payload = JSON.parse(Buffer.from(payloadPart, 'base64url').toString('utf8'));
            const audience = typeof payload.aud === 'string' ? payload.aud : '';
            if (audience === clientId || audience === `api://${clientId}`) {
              process.stdout.write(audience);
            }
          } catch {}
          NODE
          )"
          test -n "$release_audience"
          echo "Release-test Entra identity, calling application and audience derived from the token."

          container_app_id="$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query id -o tsv --only-show-errors)"
          test -n "$container_app_id"
          auth_config_id="${container_app_id}/authConfigs/current"
          auth_config_url="https://management.azure.com${auth_config_id}?api-version=${AUTH_API_VERSION}"
          auth_snapshot_file="$RUNNER_TEMP/consult-auth-original-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          auth_restore_file="$RUNNER_TEMP/consult-auth-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          auth_release_file="$RUNNER_TEMP/consult-auth-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          az rest --method get --url "$auth_config_url" --only-show-errors > "$auth_snapshot_file"
          echo "Existing Entra authorization policy snapshotted."

          auth_policy_changed="$(node - "$auth_snapshot_file" "$auth_restore_file" "$auth_release_file" "$release_principal_object_id" "$release_application_id" "$release_audience" <<'NODE'
          const fs = require('fs');
          const [sourcePath, restorePath, releasePath, releaseIdentity, releaseApplication, releaseAudience] = process.argv.slice(2);
          const source = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          if (!source.properties) throw new Error('Auth config has no properties');

          const restore = { properties: structuredClone(source.properties) };
          const release = { properties: structuredClone(source.properties) };
          const aad = release.properties.identityProviders?.azureActiveDirectory;
          if (!aad) throw new Error('Microsoft Entra authentication is not configured');
          aad.validation ??= {};
          aad.validation.defaultAuthorizationPolicy ??= {};
          aad.validation.defaultAuthorizationPolicy.allowedPrincipals ??= {};
          const principals = aad.validation.defaultAuthorizationPolicy.allowedPrincipals;
          const identities = Array.isArray(principals.identities) ? [...principals.identities] : [];
          const identityChanged = !identities.includes(releaseIdentity);
          if (identityChanged) identities.push(releaseIdentity);
          principals.identities = identities;

          const policy = aad.validation.defaultAuthorizationPolicy;
          const allowedApplications = Array.isArray(policy.allowedApplications)
            ? [...policy.allowedApplications]
            : [];
          const applicationChanged = allowedApplications.length > 0
            && !allowedApplications.includes(releaseApplication);
          if (applicationChanged) {
            allowedApplications.push(releaseApplication);
            policy.allowedApplications = allowedApplications;
          }

          const claimChecks = aad.validation.jwtClaimChecks;
          const allowedClientApplications = Array.isArray(claimChecks?.allowedClientApplications)
            ? [...claimChecks.allowedClientApplications]
            : [];
          const clientClaimChanged = allowedClientApplications.length > 0
            && !allowedClientApplications.includes(releaseApplication);
          if (clientClaimChanged) {
            allowedClientApplications.push(releaseApplication);
            claimChecks.allowedClientApplications = allowedClientApplications;
          }

          const allowedAudiences = Array.isArray(aad.validation.allowedAudiences)
            ? [...aad.validation.allowedAudiences]
            : [];
          const audienceChanged = !allowedAudiences.includes(releaseAudience);
          if (audienceChanged) {
            allowedAudiences.push(releaseAudience);
            aad.validation.allowedAudiences = allowedAudiences;
          }

          const changed = identityChanged || applicationChanged || clientClaimChanged || audienceChanged;

          fs.writeFileSync(restorePath, JSON.stringify(restore));
          fs.writeFileSync(releasePath, JSON.stringify(release));
          process.stdout.write(changed ? 'yes' : 'no');
          NODE
          )"

          if test "$auth_policy_changed" = "yes"; then
            az rest --method put --url "$auth_config_url" --body "@$auth_release_file" --only-show-errors >/dev/null
            echo "Temporarily allowed the release-test identity in Entra Easy Auth."
          fi

          sleep 10
          CONSULT_BASE_URL="$candidate_url" CONSULT_ACCESS_TOKEN="$access_token" node scripts/consult-release-smoke.mjs

          restore_auth_policy

          final_revision="$(az containerapp revision copy -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --from-revision "$candidate" --image "$IMAGE" --revision-suffix "$FINAL_SUFFIX" --min-replicas 0 --max-replicas 2 --query properties.latestRevisionName -o tsv --only-show-errors)"
          test -n "$final_revision"
          echo "Final min-zero revision: $final_revision"

          final_state=""
          for attempt in $(seq 1 36); do
            final_state="$(az containerapp revision show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --revision "$final_revision" --query properties.provisioningState -o tsv)"
            if test "$final_state" = "Provisioned"; then break; fi
            sleep 10
          done
          test "$final_state" = "Provisioned"

          final_weight="$(az containerapp ingress traffic show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query "[?revisionName=='$final_revision'].weight | [0]" -o tsv)"
          test -z "$final_weight" -o "$final_weight" = "0"

          az containerapp ingress traffic set -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --revision-weight "$final_revision=100" "$live_revision=0" --only-show-errors >/dev/null
          promoted_weight="$(az containerapp ingress traffic show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query "[?revisionName=='$final_revision'].weight | [0]" -o tsv)"
          test "$promoted_weight" = "100"

          cleanup_candidate
          candidate=""
          validation_label=""
          trap - EXIT
          echo "PROMOTED_REVISION=$final_revision"

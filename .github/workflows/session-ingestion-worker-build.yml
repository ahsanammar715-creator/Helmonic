name: Build Helmonic attachment ingestion worker

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: helmonic-session-ingestion-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_NAME: acrhelmonicdev001
  ACR_LOGIN_SERVER: acrhelmonicdev001-etd4eqevdcf6e7bs.azurecr.io
  IMAGE_REPOSITORY: helmonic-session-ingestion

jobs:
  validate-build-and-push:
    name: Validate and publish immutable worker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approved source
        uses: actions/checkout@v4

      - name: Set up the worker Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: scripts/session_ingestion/requirements.txt

      - name: Install pinned worker dependencies
        run: python -m pip install --requirement scripts/session_ingestion/requirements.txt

      - name: Validate worker imports and pure processing behavior
        run: |
          python -m py_compile scripts/session_ingestion/worker.py
          python - <<'PY'
          import importlib.util
          import sys

          spec = importlib.util.spec_from_file_location(
              "helmonic_session_worker", "scripts/session_ingestion/worker.py"
          )
          worker = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = worker
          spec.loader.exec_module(worker)
          payload = worker.validate_payload({
              "version": 1,
              "operation": "ingest-session-document",
              "jobId": "00000000-0000-4000-8000-000000000001",
              "documentId": "00000000-0000-4000-8000-000000000002",
              "documentVersionId": "00000000-0000-4000-8000-000000000003",
              "conversationId": "00000000-0000-4000-8000-000000000004",
              "ownerObjectId": "test-owner",
              "blobContainer": "consult-knowledge-uploads",
              "blobName": "test.pdf",
              "sourceUri": "https://example.invalid/test.pdf",
              "contentHash": "abc",
              "displayName": "test.pdf",
              "targetIndex": "consult-session-v1",
              "correlationId": "00000000-0000-4000-8000-000000000005",
              "expiresAt": None,
              "promoteToKnowledge": True,
          })
          assert payload["promoteToKnowledge"] is True
          assert len(list(worker.split_text("A sentence. " * 800))) > 1
          assert "| --- |" in worker.markdown_table([["A", "B"], ["1", "2"]])
          PY

      - name: Sign in to Azure with repository OIDC
        uses: azure/login@v2
        with:
          client-id: d265e55d-f8b6-421a-9a82-064183cab7e6
          tenant-id: 360eacb5-68c3-400c-a366-0382ec3a7b4a
          subscription-id: 14f94f77-4e71-4b80-b6c9-e09b192fcf42

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push the immutable worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/session_ingestion/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.helmonic.workload=session-ingestion

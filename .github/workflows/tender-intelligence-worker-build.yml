name: Build Tender Intelligence worker image

on:
  workflow_dispatch:
    inputs:
      deploy_odoo_leads_migration:
        description: Run the one-time migration of managed Tender Desk records into the Odoo Leads review queue
        required: true
        default: false
        type: boolean
      run_full_odoo_test_collection:
        description: Run one guarded full official-source collection and refresh the Odoo test Leads queue (BuildingInfo browser disabled)
        required: true
        default: false
        type: boolean
      sync_completed_odoo_checkpoint:
        description: Reuse the last completed ledger and audit to refresh Odoo test without restarting source collection
        required: true
        default: false
        type: boolean
      audit_completed_rfi_ledger:
        description: Read-only audit of acoustic/noise RFIs in the completed deduplicated ledger; does not write Odoo
        required: true
        default: false
        type: boolean
      configure_odoo_ui_only:
        description: Repair or refresh only the inherited Odoo CRM fields and views; do not rerun the lead migration
        required: true
        default: false
        type: boolean
      suspend_buildinginfo_job:
        description: Suspend the automatic BuildingInfo schedule while keeping manual runs available
        required: true
        default: false
        type: boolean
      diagnose_azure_jobs_only:
        description: Read-only inventory of Azure Container Apps Jobs; skip build and deployment
        required: true
        default: false
        type: boolean
      recover_stuck_odoo_execution:
        description: Exact dev/test execution name to stop after capturing its logs; leave blank for normal runs
        required: false
        default: ""
        type: string
      provision_buildinginfo_job:
        description: Create or update the separate 10am BuildingInfo dev/test job
        required: true
        default: false
        type: boolean
      provision_education_lookup_job:
        description: Create or update the manual Ireland-wide Education / BIM lookup job (BuildingInfo excluded)
        required: true
        default: false
        type: boolean
      automate_education_lookup_job:
        description: Schedule the Education / BIM collector daily at 8am Dublin time; BuildingInfo and outreach remain disabled
        required: true
        default: false
        type: boolean
      start_buildinginfo_test_run:
        description: Start one controlled BuildingInfo dev/test execution after provisioning (credentials must already exist)
        required: true
        default: false
        type: boolean
  push:
    branches:
      - codex/tender-intelligence-release
    paths:
      - Dockerfile.tender-intelligence
      - package.json
      - package-lock.json
      - scripts/tender_intelligence/**
      - scripts/deployment/provision-buildinginfo-job.sh
      - scripts/deployment/provision-education-lookup-job.sh
      - src/lib/tender-intelligence/**
      - .github/workflows/tender-intelligence-worker-build.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: tender-intelligence-worker-${{ github.ref }}
  cancel-in-progress: false

env:
  ACR_NAME: acrhelmonicdev001
  ACR_LOGIN_SERVER: acrhelmonicdev001-etd4eqevdcf6e7bs.azurecr.io
  IMAGE_REPOSITORY: helmonic-tender-intelligence
  AZURE_RESOURCE_GROUP: RG-HELMONIC-DEV
  AZURE_JOB_NAME: ca-helmonic-ti-dev-001
  AZURE_BUILDINGINFO_JOB_NAME: ca-helmonic-ti-bi-dev-001
  AZURE_EDUCATION_JOB_NAME: ca-helmonic-ti-education-dev-001

jobs:
  diagnose-azure-jobs:
    name: Read-only Azure Container Apps Job inventory
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_azure_jobs_only
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: d265e55d-f8b6-421a-9a82-064183cab7e6
          tenant-id: 360eacb5-68c3-400c-a366-0382ec3a7b4a
          subscription-id: 14f94f77-4e71-4b80-b6c9-e09b192fcf42

      - name: List visible Container Apps Jobs without changing them
        shell: bash
        run: |
          set -euo pipefail
          az account show \
            --query '{subscriptionId:id,subscriptionName:name,tenantId:tenantId}' \
            --output json
          az containerapp job list \
            --query '[].{resourceGroup:resourceGroup,name:name,triggerType:properties.configuration.triggerType,image:properties.template.containers[0].image}' \
            --output json
          for job_name in "$AZURE_JOB_NAME" "$AZURE_BUILDINGINFO_JOB_NAME"; do
            echo "::group::${job_name} schedule and recent executions"
            az containerapp job show \
              --name "$job_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query '{name:name,triggerType:properties.configuration.triggerType,cron:properties.configuration.scheduleTriggerConfig.cronExpression,replicaTimeout:properties.configuration.replicaTimeout,replicaRetryLimit:properties.configuration.replicaRetryLimit,image:properties.template.containers[0].image}' \
              --output json
            az containerapp job execution list \
              --name "$job_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query '[:10].{name:name,status:properties.status,startTime:properties.startTime,endTime:properties.endTime}' \
              --output json
            echo "::endgroup::"
          done

          running_execution="$(az containerapp job execution list \
            --name "$AZURE_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '[?properties.status == `Running`] | [0].name' \
            --output tsv)"
          if [[ -n "$running_execution" ]]; then
            container_name="$(az containerapp job show \
              --name "$AZURE_JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query 'properties.template.containers[0].name' \
              --output tsv)"
            echo "::group::Live output for running execution $running_execution"
            az containerapp job logs show \
              --name "$AZURE_JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --execution "$running_execution" \
              --container "$container_name" \
              --format text \
              --tail 300 2>&1 || true
            echo "::endgroup::"
          fi

  suspend-buildinginfo-job:
    name: Switch the BuildingInfo job to manual-only
    if: github.event_name == 'workflow_dispatch' && inputs.suspend_buildinginfo_job
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: d265e55d-f8b6-421a-9a82-064183cab7e6
          tenant-id: 360eacb5-68c3-400c-a366-0382ec3a7b4a
          subscription-id: 14f94f77-4e71-4b80-b6c9-e09b192fcf42

      - name: Disable the schedule but keep manual runs available
        shell: bash
        run: |
          set -euo pipefail

          job_id="$(az containerapp job show \
            --name "$AZURE_BUILDINGINFO_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query id \
            --output tsv)"

          az rest \
            --method patch \
            --uri "https://management.azure.com${job_id}?api-version=2025-07-01" \
            --body '{"properties":{"configuration":{"triggerType":"Manual","manualTriggerConfig":{"parallelism":1,"replicaCompletionCount":1}}}}' \
            --only-show-errors \
            --output none

          trigger_type="$(az containerapp job show \
            --name "$AZURE_BUILDINGINFO_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.triggerType \
            --output tsv)"

          if [[ "$trigger_type" != "Manual" ]]; then
            echo "BuildingInfo job trigger is $trigger_type, not Manual." >&2
            exit 1
          fi

          echo "BuildingInfo automated schedule is suspended; manual execution remains available."

  recover-stuck-odoo-execution:
    name: Stop one exact stuck dev/test Odoo execution
    if: github.event_name == 'workflow_dispatch' && inputs.recover_stuck_odoo_execution != ''
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: d265e55d-f8b6-421a-9a82-064183cab7e6
          tenant-id: 360eacb5-68c3-400c-a366-0382ec3a7b4a
          subscription-id: 14f94f77-4e71-4b80-b6c9-e09b192fcf42

      - name: Capture logs, stop the exact execution and restore recurring safety
        shell: bash
        env:
          STUCK_EXECUTION: ${{ inputs.recover_stuck_odoo_execution }}
        run: |
          set -euo pipefail

          if [[ ! "$STUCK_EXECUTION" =~ ^ca-helmonic-ti-dev-001-[a-z0-9]+$ ]]; then
            echo "Refusing unexpected execution name: $STUCK_EXECUTION" >&2
            exit 1
          fi

          status="$(az containerapp job execution show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --job-execution-name "$STUCK_EXECUTION" \
            --query properties.status \
            --output tsv)"
          container_name="$(az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --query 'properties.template.containers[0].name' \
            --output tsv)"

          echo "Execution $STUCK_EXECUTION status before recovery: $status"
          az containerapp job logs show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --execution "$STUCK_EXECUTION" \
            --container "$container_name" \
            --format text \
            --tail 300 2>&1 || true

          if [[ "$status" == "Running" ]]; then
            az containerapp job stop \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_JOB_NAME" \
              --job-execution-name "$STUCK_EXECUTION" \
              --only-show-errors \
              --output none
          fi

          for attempt in {1..30}; do
            status="$(az containerapp job execution show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_JOB_NAME" \
              --job-execution-name "$STUCK_EXECUTION" \
              --query properties.status \
              --output tsv 2>/dev/null || true)"
            [[ "$status" != "Running" ]] && break
            echo "Waiting for $STUCK_EXECUTION to stop (check $attempt/30)."
            sleep 10
          done
          if [[ "$status" == "Running" ]]; then
            echo "Execution $STUCK_EXECUTION is still running after the bounded stop wait." >&2
            exit 1
          fi

          az containerapp job update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --set-env-vars \
              ODOO_MIGRATE_MANAGED_RECORDS_TO_LEADS=false \
              ODOO_NORMALIZE_HISTORICAL_RECORDS=true \
              ODOO_ARCHIVE_UNMANAGED_TEST_FIXTURES=false \
              ODOO_REQUEST_INTERVAL_MS=250 \
              ODOO_CRM_UI_CONFIG_ENABLED=false \
              ODOO_CRM_UI_CONFIG_REQUIRED=false \
              HELMONIC_ODOO_PREFLIGHT_ONLY=false \
              HELMONIC_ODOO_MIGRATION_ONLY=false \
              HELMONIC_SCHEDULE_GUARD_ENABLED=true \
              NODE_OPTIONS=--experimental-strip-types \
            --command node \
            --args scripts/tender_intelligence/run-daily-automation.mjs \
            --only-show-errors >/dev/null

          echo "Recovered $STUCK_EXECUTION with final status ${status:-unknown}; recurring safe mode restored."

  build-and-push:
    name: Build and publish immutable worker image
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (!inputs.diagnose_azure_jobs_only && !inputs.suspend_buildinginfo_job && inputs.recover_stuck_odoo_execution == '')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4

      - name: Install exact dependencies
        run: npm ci

      - name: Run Tender Intelligence tests
        run: npm run test:tender-intelligence

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: d265e55d-f8b6-421a-9a82-064183cab7e6
          tenant-id: 360eacb5-68c3-400c-a366-0382ec3a7b4a
          subscription-id: 14f94f77-4e71-4b80-b6c9-e09b192fcf42

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and publish the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tender-intelligence
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Publish the approved daily worker and prove one complete run
        if: >-
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[publish-ti-worker]')
        timeout-minutes: 180
        shell: bash
        run: |
          set -euo pipefail

          image="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:${{ github.sha }}"

          running_execution="$(az containerapp job execution list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --query "[?properties.status=='Running'].name | [0]" \
            --output tsv 2>/dev/null || true)"
          if [[ -n "$running_execution" ]]; then
            echo "Refusing to publish while execution $running_execution is still running." >&2
            exit 1
          fi

          az containerapp job update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --image "$image" \
            --cron-expression "0 7 * * *" \
            --set-env-vars \
              HELMONIC_SCHEDULE_GUARD_ENABLED=false \
              NODE_OPTIONS=--experimental-strip-types \
            --command node \
            --args scripts/tender_intelligence/run-daily-automation.mjs \
            --only-show-errors >/dev/null

          deployed_image="$(az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          deployed_cron="$(az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --query 'properties.configuration.scheduleTriggerConfig.cronExpression' \
            --output tsv)"
          deployed_guard="$(az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --query "properties.template.containers[0].env[?name=='HELMONIC_SCHEDULE_GUARD_ENABLED'] | [0].value" \
            --output tsv)"

          [[ "$deployed_image" == "$image" ]] || {
            echo "Published image mismatch: expected $image, found $deployed_image" >&2
            exit 1
          }
          [[ "$deployed_cron" == "0 7 * * *" ]] || {
            echo "Published cron mismatch: expected 0 7 * * *, found $deployed_cron" >&2
            exit 1
          }
          [[ "$deployed_guard" == "false" ]] || {
            echo "Schedule guard mismatch: expected false, found $deployed_guard" >&2
            exit 1
          }

          execution_name="$(az containerapp job start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --query name \
            --output tsv)"
          if [[ -z "$execution_name" ]]; then
            echo "Azure did not return a validation execution name." >&2
            exit 1
          fi

          echo "Started full published-worker validation: $execution_name"
          status=""
          for attempt in {1..360}; do
            status="$(az containerapp job execution show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_JOB_NAME" \
              --job-execution-name "$execution_name" \
              --query properties.status \
              --output tsv 2>/dev/null || true)"
            case "$status" in
              Succeeded)
                echo "Full published-worker validation succeeded."
                break
                ;;
              Failed)
                echo "Full published-worker validation failed: $execution_name" >&2
                break
                ;;
              *)
                echo "Validation status: ${status:-starting} (check $attempt/360)"
                sleep 30
                ;;
            esac
          done

          container_name="$(az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --query 'properties.template.containers[0].name' \
            --output tsv)"
          validation_logs="$(az containerapp job logs show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --execution "$execution_name" \
            --container "$container_name" \
            --format text \
            --tail 500 2>&1 || true)"
          printf '%s\n' "$validation_logs"

          [[ "$status" == "Succeeded" ]] || {
            echo "Published-worker validation ended with status ${status:-unknown}." >&2
            exit 1
          }
          grep -F 'TENDER_INTELLIGENCE_HEALTH_JSON=' <<<"$validation_logs" >/dev/null || {
            echo "Validation completed without a durable health receipt in the worker log." >&2
            exit 1
          }
          grep -F '"healthy":true' <<<"$validation_logs" >/dev/null || {
            echo "The durable health receipt did not report a healthy run." >&2
            exit 1
          }

          echo "Published worker verified: image=$deployed_image cron=$deployed_cron guard=$deployed_guard execution=$execution_name"

      - name: Create or update the separate 10am BuildingInfo dev/test job
        if: github.event_name == 'workflow_dispatch' && inputs.provision_buildinginfo_job
        shell: bash
        env:
          AZURE_SOURCE_JOB_NAME: ${{ env.AZURE_JOB_NAME }}
          BUILDINGINFO_IMAGE: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          BUILDINGINFO_CONSENT_REFERENCE: account-owner-confirmed-provider-agreement-2026-10-23
          BUILDINGINFO_RUN_SMOKE_TEST: ${{ inputs.start_buildinginfo_test_run }}
        run: bash scripts/deployment/provision-buildinginfo-job.sh

      - name: Create or update the manual Education / BIM lookup job
        if: github.event_name == 'workflow_dispatch' && inputs.provision_education_lookup_job
        shell: bash
        env:
          AZURE_SOURCE_JOB_NAME: ${{ env.AZURE_JOB_NAME }}
          EDUCATION_LOOKUP_IMAGE: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          EDUCATION_LOOKUP_AUTOMATED: ${{ inputs.automate_education_lookup_job }}
        run: bash scripts/deployment/provision-education-lookup-job.sh

      - name: Repair inherited Odoo CRM fields and views only
        if: github.event_name == 'workflow_dispatch' && inputs.configure_odoo_ui_only
        shell: bash
        run: |
          set -euo pipefail

          restore_safe_recurring_mode() {
            az containerapp job update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_JOB_NAME" \
              --set-env-vars \
                ODOO_MIGRATE_MANAGED_RECORDS_TO_LEADS=false \
                ODOO_NORMALIZE_HISTORICAL_RECORDS=true \
                ODOO_ARCHIVE_UNMANAGED_TEST_FIXTURES=false \
                ODOO_REQUEST_INTERVAL_MS=250 \
                ODOO_CRM_UI_CONFIG_ENABLED=false \
                ODOO_CRM_UI_CONFIG_REQUIRED=false \
                HELMONIC_ODOO_PREFLIGHT_ONLY=false \
                HELMONIC_ODOO_MIGRATION_ONLY=false \
                HELMONIC_SCHEDULE_GUARD_ENABLED=true \
                NODE_OPTIONS=--experimental-strip-types \
              --command node \
              --args scripts/tender_intelligence/run-daily-automation.mjs \
              --only-show-errors >/dev/null
          }

          wait_for_execution() {
            local execution_name="$1"
            if [[ -z "$execution_name" ]]; then
              echo "Azure did not return a job execution name for the Odoo UI repair." >&2
              return 1
            fi

            echo "Started approved Odoo UI repair: $execution_name"
            for attempt in {1..40}; do
              status="$(az containerapp job execution show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_JOB_NAME" \
                --job-execution-name "$execution_name" \
                --query properties.status \
                --output tsv 2>/dev/null || true)"

              case "$status" in
                Succeeded)
                  echo "Approved Odoo UI repair succeeded."
                  return 0
                  ;;
                Failed)
                  echo "Approved Odoo UI repair failed: $execution_name" >&2
                  container_name="$(az containerapp job show \
                    --resource-group "$AZURE_RESOURCE_GROUP" \
                    --name "$AZURE_JOB_NAME" \
                    --query 'properties.template.containers[0].name' \
                    --output tsv 2>/dev/null || true)"
                  if [[ -n "$container_name" ]]; then
                    az containerapp job logs show \
                      --resource-group "$AZURE_RESOURCE_GROUP" \
                      --name "$AZURE_JOB_NAME" \
                      --execution "$execution_name" \
                      --container "$container_name" \
                      --format text \
                      --tail 200 2>&1 || true
                  fi
                  return 1
                  ;;
                *)
                  echo "Odoo UI repair status: ${status:-starting} (check $attempt/40)"
                  sleep 15
                  ;;
              esac
            done

            echo "Approved Odoo UI repair did not finish within 10 minutes." >&2
            return 1
          }

          trap restore_safe_recurring_mode EXIT

          az containerapp job update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:${{ github.sha }}" \
            --set-env-vars \
              ODOO_CRM_UI_CONFIG_ENABLED=true \
              ODOO_CRM_UI_CONFIG_REQUIRED=true \
              HELMONIC_SCHEDULE_GUARD_ENABLED=false \
              NODE_OPTIONS=--experimental-strip-types \
            --command node \
            --args scripts/tender_intelligence/configure-odoo-crm-ui.mjs \
            --only-show-errors >/dev/null

          execution_name="$(az containerapp job start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --query name \
            --output tsv)"
          wait_for_execution "$execution_name"

      - name: Migrate managed Tender Desk records to the Odoo Leads review queue
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.deploy_odoo_leads_migration) ||
          contains(github.event.head_commit.message, '[odoo-leads-migration]')
        shell: bash
        run: |
          set -euo pipefail

          restore_safe_recurring_mode() {
            az containerapp job update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_JOB_NAME" \
              --set-env-vars \
                ODOO_MIGRATE_MANAGED_RECORDS_TO_LEADS=false \
                ODOO_NORMALIZE_HISTORICAL_RECORDS=true \
                ODOO_ARCHIVE_UNMANAGED_TEST_FIXTURES=false \
                ODOO_REQUEST_INTERVAL_MS=250 \
                ODOO_CRM_UI_CONFIG_ENABLED=false \
                ODOO_CRM_UI_CONFIG_REQUIRED=false \
                HELMONIC_ODOO_PREFLIGHT_ONLY=false \
                HELMONIC_ODOO_MIGRATION_ONLY=false \
                HELMONIC_SCHEDULE_GUARD_ENABLED=true \
                NODE_OPTIONS=--experimental-strip-types \
              --command node \
              --args scripts/tender_intelligence/run-daily-automation.mjs \
              --only-show-errors >/dev/null
          }

          wait_for_execution() {
            local execution_name="$1"
            local label="$2"

            if [[ -z "$execution_name" ]]; then
              echo "Azure did not return a job execution name for $label." >&2
              return 1
            fi

            echo "Started $label: $execution_name"
            for attempt in {1..80}; do
              status="$(az containerapp job execution show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_JOB_NAME" \
                --job-execution-name "$execution_name" \
                --query properties.status \
                --output tsv 2>/dev/null || true)"

              case "$status" in
                Succeeded)
                  echo "$label succeeded."
                  return 0
                  ;;
                Failed)
                  echo "$label failed: $execution_name" >&2
                  container_name="$(az containerapp job show \
                    --resource-group "$AZURE_RESOURCE_GROUP" \
                    --name "$AZURE_JOB_NAME" \
                    --query 'properties.template.containers[0].name' \
                    --output tsv 2>/dev/null || true)"
                  if [[ -n "$container_name" ]]; then
                    echo "--- $label container output ---" >&2
                    az containerapp job logs show \
                      --resource-group "$AZURE_RESOURCE_GROUP" \
                      --name "$AZURE_JOB_NAME" \
                      --execution "$execution_name" \
                      --container "$container_name" \
                      --format text \
                      --tail 200 2>&1 || true
                    echo "--- end $label container output ---" >&2
                  fi
                  return 1
                  ;;
                *)
                  echo "$label status: ${status:-starting} (check $attempt/80)"
                  sleep 30
                  ;;
              esac
            done

            echo "$label did not finish within 40 minutes." >&2
            return 1
          }

          trap restore_safe_recurring_mode EXIT

          # The integration account is intentionally allowed to keep syncing
          # lead data even when an Odoo administrator has not granted it the
          # separate technical permission needed to manage models/views. The
          # strict zero-write preflight below still has to prove that every
          # required field already exists before the controlled sync can run.
          ui_config_enabled=false

          # This migration path is deliberately invoked only by an approved
          # workflow dispatch or an audited release commit marker.
          # Provision the explicitly approved custom fields and inherited views
          # before the strict preflight checks the complete field contract. This
          # is confined to the controlled dev/test migration path; the normal
          # scheduled run keeps UI configuration disabled.
          az containerapp job update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:${{ github.sha }}" \
            --set-env-vars \
              ODOO_CRM_UI_CONFIG_ENABLED=true \
              ODOO_CRM_UI_CONFIG_REQUIRED=true \
              HELMONIC_ODOO_MIGRATION_ONLY=false \
              HELMONIC_SCHEDULE_GUARD_ENABLED=false \
              NODE_OPTIONS=--experimental-strip-types \
            --command node \
            --args scripts/tender_intelligence/configure-odoo-crm-ui.mjs \
            --only-show-errors >/dev/null

          schema_execution="$(az containerapp job start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --query name \
            --output tsv)"
          if wait_for_execution "$schema_execution" "approved Odoo test schema bootstrap"; then
            ui_config_enabled=true
          else
            echo "::warning::Odoo denied the admin-only schema/view refresh. Continuing with the existing field contract; the zero-write preflight must still pass before any lead data is changed."
          fi

          # Validate the exact Odoo test endpoint, field contract, Tender Desk
          # team/stage and consultant users before permitting any write.
          az containerapp job update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:${{ github.sha }}" \
            --set-env-vars \
              HELMONIC_ODOO_PREFLIGHT_ONLY=true \
              ODOO_MIGRATE_MANAGED_RECORDS_TO_LEADS=false \
              ODOO_NORMALIZE_HISTORICAL_RECORDS=false \
              ODOO_ARCHIVE_UNMANAGED_TEST_FIXTURES=false \
              ODOO_CRM_UI_CONFIG_ENABLED=false \
              ODOO_CRM_UI_CONFIG_REQUIRED=false \
              HELMONIC_ODOO_MIGRATION_ONLY=false \
              HELMONIC_SCHEDULE_GUARD_ENABLED=false \
              NODE_OPTIONS=--experimental-strip-types \
            --command node \
            --args scripts/tender_intelligence/run-daily-automation.mjs \
            --only-show-errors >/dev/null

          preflight_execution="$(az containerapp job start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --query name \
            --output tsv)"
          wait_for_execution "$preflight_execution" "zero-write Odoo preflight"

          az containerapp job update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:${{ github.sha }}" \
            --set-env-vars \
              ODOO_MIGRATE_MANAGED_RECORDS_TO_LEADS=true \
              ODOO_NORMALIZE_HISTORICAL_RECORDS=true \
              ODOO_ARCHIVE_UNMANAGED_TEST_FIXTURES=true \
              ODOO_REQUEST_INTERVAL_MS=150 \
              ODOO_CRM_UI_CONFIG_ENABLED=false \
              ODOO_CRM_UI_CONFIG_REQUIRED=false \
              HELMONIC_ODOO_PREFLIGHT_ONLY=false \
              HELMONIC_ODOO_MIGRATION_ONLY=true \
              HELMONIC_SCHEDULE_GUARD_ENABLED=false \
              NODE_OPTIONS=--experimental-strip-types \
            --command node \
            --args scripts/tender_intelligence/run-daily-automation.mjs \
            --only-show-errors >/dev/null

          execution_name="$(az containerapp job start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --query name \
            --output tsv)"
          wait_for_execution "$execution_name" "controlled Odoo test sync"

          az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_JOB_NAME" \
            --query '{image:properties.template.containers[0].image,triggerType:properties.configuration.triggerType,schedule:properties.configuration.scheduleTriggerConfig.cronExpression}' \
            --output json

      - name: Run one guarded full official-source collection into Odoo test
        if: github.event_name == 'workflow_dispatch' && inputs.run_full_odoo_test_collection
        shell: bash
        env:
          TENDER_INTELLIGENCE_IMAGE: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: bash scripts/deployment/run-full-odoo-test-collection.sh

      - name: Sync the completed authoritative ledger into Odoo test
        if: github.event_name == 'workflow_dispatch' && inputs.sync_completed_odoo_checkpoint
        shell: bash
        env:
          TENDER_INTELLIGENCE_IMAGE: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          HELMONIC_ODOO_COMPLETED_LEDGER_SYNC_ONLY: "true"
        run: bash scripts/deployment/run-full-odoo-test-collection.sh

      - name: Audit acoustic and noise RFIs in the completed ledger
        if: github.event_name == 'workflow_dispatch' && inputs.audit_completed_rfi_ledger
        shell: bash
        env:
          TENDER_INTELLIGENCE_IMAGE: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: bash scripts/deployment/run-rfi-ledger-audit.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify container runtime hardening
        run: npm run verify:runtime

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate model answer policy
        run: npm run test:model-policy

      - name: Validate bounded audio pilot policy
        run: npm run test:audio-pilot

      - name: Validate standing worker proof policy
        run: npm run test:standing-worker-proof

      - name: Validate corpus pilot policy
        run: npm run test:corpus-pilot

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Playwright 1.56 supports Ubuntu 24.04; ubuntu-latest moved to 26.04,
    # where Chromium dependency installation is not available for this version.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify container runtime hardening
        run: npm run verify:runtime

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate model answer policy
        run: npm run test:model-policy

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
